name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: fpm test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          # Match the gcc the prebuilt fpm binary is linked against, so its
          # libgfortran is present (otherwise fpm fails to load on macOS).
          version: "12"

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v10

      - name: Run the test suite
        run: fpm test
        working-directory: test/fpm
